apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: user-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
   matchLabels:
     app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 50052
          name: grpc
        env:
        - name: DB_HOST
          value: {{ .Values.database.host | quote }}
        - name: DB_PORT
          value: {{ .Values.database.port | quote }}
        - name: DB_USER
          value: {{ .Values.database.user | quote }}
        - name: DB_NAME
          value: {{ .Values.database.name | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskboard-db-postgresql
              key: password
        - name: DB_SSLMODE
          value: {{ .Values.database.sslmode | quote }}
        - name: JWT_SECRET
          value: {{ .Values.jwt.secret | quote }}
        - name: PORT
          value: "50052"
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
        readinessProbe:
          tcpSocket:
            port: 50052
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50052
          initialDelaySeconds: 10
          periodSeconds: 10
